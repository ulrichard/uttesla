clickable_minimum_required: 8.0.0
builder: rust
framework: ubuntu-touch-24.04-1.x
kill: uttesla
install_root_data:
- manifest.json
- uttesla.apparmor
- uttesla.desktop
- assets
rust_channel: "1.90"
image_setup:
  run:
  - wget -O - https://apt.llvm.org/llvm-snapshot.gpg.key | apt-key add -
  - apt-add-repository "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-17 main"
  - apt-get update
